name: SquadFutbol Scheduler

on:
  workflow_dispatch:
  schedule:
    # Todos os schedules agregados no mesmo workflow
    # Daily Pipeline - 04:00 UTC = 06:00 BR
    - cron: '0 4 * * *'
    # Daily Pipeline Extra - 11:00 UTC = 13:00 BR
    - cron: '0 11 * * *'
    # Backfill - 23:00 UTC = 01:00 BR
    - cron: '0 23 * * *'
    # Weekly Report - Domingos 23:00 UTC = 01:00 BR
    - cron: '0 23 * * 0'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # DAILY PIPELINE — 04:00 UTC e 11:00 UTC
  # ─────────────────────────────────────────────────────────────────────────────
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 4 * * *') || (github.event.schedule == '0 11 * * *')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run daily

  # ─────────────────────────────────────────────────────────────────────────────
  # PRELIVE SCAN — A cada 30min (via schedule separado)
  # Não é possível ter múltiplas frequências no mesmo workflow
  # Para prelive scan frequentes, criar workflow dedicado
  # ─────────────────────────────────────────────────────────────────────────────
  prelive-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prelive Scan
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/prelive-superodds-now.js

  # ─────────────────────────────────────────────────────────────────────────────
  # RESULT BACKFILL — 23:00 UTC
  # ─────────────────────────────────────────────────────────────────────────────
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 23 * * *')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Backfill
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
        run: npm run backfill

  # ─────────────────────────────────────────────────────────────────────────────
  # WEEKLY REPORT — Domingos 23:00 UTC
  # ─────────────────────────────────────────────────────────────────────────────
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 23 * * 0')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Weekly Report
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: npm run daily-report